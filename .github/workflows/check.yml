name: Check

on:
    push:
        branches:
            - main
            - master
            - develop
    pull_request:
    workflow_dispatch:

jobs:
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20'

            - name: Install pnpm
              run: npm install -g pnpm

            - name: Install dependencies
              run: pnpm install
      
            - name: Lint code
              run: pnpm lint

            - name: Run tests
              run: pnpm test